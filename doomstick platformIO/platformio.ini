; doomstick - subset of doomBOX for ESP32-C3 SuperMini
; OLED 0.96" SSD1306 (software 128x64 for module compatibility)
; 2 buttons: MOVE + SELECT
; Features: Beacon Spam, Deauth, SuperSniffer, Camera Deauther,
;           PMKID/EAPOL capture, Pwnagotchi Spam, Reaper

[env:doomstick]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
build_flags =
	-Wl,-z,muldefs
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
	olikraus/U8g2@^2.36.2
	bblanchon/ArduinoJson@^7.4.2
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
